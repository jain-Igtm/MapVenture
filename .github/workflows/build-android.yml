name: Build Android APK

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mapventure-personal-debug-signing-v1

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and sync Android project
        run: npm run sync:android

      - name: Compile installable APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MapVenture.apk
          sha256sum MapVenture.apk > MapVenture.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapVenture-Android
          path: |
            MapVenture.apk
            MapVenture.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            MapVenture.apk \
            MapVenture.apk.sha256 \
            --title "MapVenture Android build ${GITHUB_RUN_NUMBER}" \
            --notes "Install MapVenture.apk on Android 7 or newer. This build uses a stable signing identity so future updates can install over it." \
            --latest
